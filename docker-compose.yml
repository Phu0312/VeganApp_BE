name: veggiepal

services:
  mysql:
    image: mysql:8.4
    container_name: veggiepal-mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: 12345
      MYSQL_DATABASE: veggiepal

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql


  minio:
    image: coollabsio/minio:latest
    container_name: veggiepal-minio
    restart: always

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data


  # One-shot: create the public-read buckets. The services only PUT objects and return
  # <S3_PUBLIC_URL>/<key>, so without anonymous download the browser gets 403 on every image.
  # Retry loop instead of a healthcheck: the minio image may not ship `mc`.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: veggiepal-minio-init

    depends_on:
      - minio

    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done &&
      mc mb --ignore-existing local/veggiepal-avatars &&
      mc anonymous set download local/veggiepal-avatars &&
      mc mb --ignore-existing local/veggiepal-blog-thumbnails &&
      mc anonymous set download local/veggiepal-blog-thumbnails
      "


  identity-service:
    build:
      context: ./identity-service
      dockerfile: Dockerfile

    container_name: veggiepal-identity
    restart: unless-stopped

    ports:
      - "8081:8081"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/veggiepal_identity
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 12345

      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: veggiepal-avatars

      # Trình duyệt bên ngoài Docker dùng localhost
      S3_PUBLIC_URL: http://localhost:9000/veggiepal-avatars

    depends_on:
      - mysql
      - minio


volumes:
  mysql_data:
  minio_data: