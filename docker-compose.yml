name: veggiepal

services:
  mysql:
    image: mysql:8.4
    container_name: veggiepal-mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: 12345
      MYSQL_DATABASE: veggiepal

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql


  minio:
    image: coollabsio/minio:latest
    container_name: veggiepal-minio
    restart: always

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data


  identity-service:
    build:
      context: ./identity-service
      dockerfile: Dockerfile

    container_name: veggiepal-identity
    restart: unless-stopped

    ports:
      - "8081:8081"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/veggiepal_identity
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 12345

      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: veggiepal-avatars

      # Trình duyệt bên ngoài Docker dùng localhost
      S3_PUBLIC_URL: http://localhost:9000/veggiepal-avatars

    depends_on:
      - mysql
      - minio


volumes:
  mysql_data:
  minio_data: